services:
  ollama:
    image: ollama/ollama:0.16.1
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-60m}
      OLLAMA_NUM_PARALLEL: ${OLLAMA_NUM_PARALLEL:-4}
      OLLAMA_NUM_THREAD: ${OLLAMA_NUM_THREAD:-4}
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - '127.0.0.1:21435:11434'
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '3.5'
          memory: 6G

volumes:
  ollama_data: {}
